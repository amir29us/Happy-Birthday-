<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday ZoYa ✨</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      background: radial-gradient(circle at center, #2b1055 0%, #7597de 50%, #0f0c29 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
    }

    /* Floating Background Particles */
    #particles-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }

    /* Screen Management */
    .screen {
      display: none;
      width: 100%;
      max-width: 440px;
      padding: 30px 20px;
      text-align: center;
      min-height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      position: relative;
    }
    .screen.active {
      display: flex;
      animation: magicFade 0.9s ease-out forwards;
    }
    @keyframes magicFade {
      0% { opacity: 0; transform: scale(0.85) translateY(20px); filter: blur(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    .title-gold {
      font-family: 'Dancing Script', cursive;
      font-size: 42px;
      background: linear-gradient(45deg, #ffeaa7, #fdcb6e, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(253, 203, 110, 0.4);
      margin-bottom: 8px;
    }
    .subtitle-light {
      font-family: 'Caveat', cursive;
      font-size: 24px;
      color: #dfe6e9;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    /* Stage 1: Magical Gift Box */
    .gift-box-stage {
      font-size: 90px;
      cursor: pointer;
      animation: bounceBox 1.5s infinite alternate;
      filter: drop-shadow(0 0 25px rgba(253, 203, 110, 0.6));
      transition: transform 0.3s;
    }
    .gift-box-stage:hover { transform: scale(1.15); }
    @keyframes bounceBox {
      0% { transform: translateY(0); }
      100% { transform: translateY(-15px); }
    }

    /* Stage 2: Key & Lock */
    .lock-box {
      font-size: 80px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 20px #fdcb6e);
      cursor: pointer;
    }
    .key-btn {
      background: linear-gradient(45deg, #fdcb6e, #e17055);
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(225, 112, 85, 0.5);
      transition: transform 0.2s;
    }
    .key-btn:hover { transform: scale(1.08); }

    /* Stage 3: Multi-Layer Cake */
    .cake-container {
      position: relative;
      width: 220px;
      height: 170px;
      margin: 20px 0;
    }
    .candles-list {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: absolute;
      top: -20px;
      width: 100%;
      z-index: 5;
    }
    .candle-item { cursor: pointer; display: flex; flex-direction: column; align-items: center; }
    .flame-light {
      width: 12px; height: 18px;
      background: linear-gradient(to top, #ff7675, #ffeaa7);
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 15px #ffeaa7, 0 0 25px #ff7675;
      animation: flicker 0.6s infinite alternate;
    }
    .flame-light.off { display: none; }
    .candle-stick { width: 8px; height: 35px; background: linear-gradient(#a29bfe, #6c5ce7); border-radius: 4px; }
    @keyframes flicker {
      from { transform: scale(0.9); opacity: 0.8; }
      to { transform: scale(1.15); opacity: 1; }
    }
    .cake-layer-top { width: 140px; height: 50px; background: #fd79a8; border-radius: 12px 12px 0 0; margin: 0 auto; }
    .cake-layer-mid { width: 180px; height: 55px; background: #ffeaa7; border-radius: 8px; margin: 0 auto; }
    .cake-layer-base { width: 220px; height: 60px; background: #6c5ce7; border-radius: 0 0 12px 12px; margin: 0 auto; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
